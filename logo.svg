<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0F0F"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1DDB7E"/>
      <stop offset="100%" stop-color="#00B85F"/>
    </linearGradient>
    <linearGradient id="plugBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E0E0"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="subtleGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App icon background -->
  <rect width="500" height="500" rx="110" ry="110" fill="#080808"/>
  <rect width="500" height="500" rx="110" ry="110" fill="none" stroke="#1DDB7E" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- Green ambient glow -->
  <ellipse cx="250" cy="270" rx="110" ry="95" fill="#1DDB7E" opacity="0.05" filter="url(#softGlow)"/>

  <!-- PLUG BODY -->
  <rect x="175" y="228" width="150" height="114" rx="24" ry="24" fill="url(#plugBodyGrad)"/>

  <!-- LEFT PRONG -->
  <rect x="196" y="168" width="34" height="66" rx="15" ry="15" fill="url(#plugBodyGrad)"/>

  <!-- RIGHT PRONG -->
  <rect x="270" y="168" width="34" height="66" rx="15" ry="15" fill="url(#plugBodyGrad)"/>

  <!-- CORD -->
  <rect x="228" y="340" width="44" height="50" rx="15" ry="15" fill="url(#plugBodyGrad)"/>

  <!-- GREEN EYES -->
  <circle cx="220" cy="276" r="15" fill="url(#greenGrad)" filter="url(#subtleGlow)"/>
  <circle cx="280" cy="276" r="15" fill="url(#greenGrad)" filter="url(#subtleGlow)"/>

  <!-- LIGHTNING BOLT on plug body -->
  <path d="M260 250 L243 280 L253 280 L243 310 L268 274 L256 274 Z"
        fill="url(#greenGrad)" filter="url(#subtleGlow)"/>

  <!-- Glow at prong tips -->
  <ellipse cx="213" cy="174" rx="10" ry="6" fill="#1DDB7E" opacity="0.5" filter="url(#subtleGlow)"/>
  <ellipse cx="287" cy="174" rx="10" ry="6" fill="#1DDB7E" opacity="0.5" filter="url(#subtleGlow)"/>

  <!-- Glow dot at cord bottom -->
  <circle cx="250" cy="385" r="7" fill="#1DDB7E" opacity="0.45" filter="url(#subtleGlow)"/>
</svg>
